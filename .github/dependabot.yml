version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
    target-branch: "master"
    labels:
      - "security"
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: daily
    target-branch: "master"
    labels:
      - "security"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    target-branch: "master"
    labels:
      - "security"
  - package-ecosystem: docker
    directories:
      - "/docker-compose/app"
      - "/docker-compose/opensearch-dashboards"
    schedule:
      interval: daily
    target-branch: "master"
    labels:
      - "security"
    ignore:
      # A PHP minor (8.4 -> 8.5) is a language upgrade, not a patch bump
      - dependency-name: "php"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: daily
    target-branch: "master"
    labels:
      - "security"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    target-branch: "master"
    labels:
      - "security"
    # Version updates only; security updates ignore both the schedule and the cooldown.
    cooldown:
      default-days: 5
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    target-branch: "master"
    labels:
      - "security"
    cooldown:
      default-days: 5
    groups:
      composer-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    target-branch: "master"
    labels:
      - "security"
    cooldown:
      default-days: 5
    groups:
      github-actions-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directories:
      - "/docker-compose/app"
      - "/docker-compose/opensearch-dashboards"
    schedule:
      interval: weekly
      day: monday
    target-branch: "master"
    labels:
      - "security"
    cooldown:
      default-days: 5
    ignore:
      # A PHP minor (8.4 -> 8.5) is a language upgrade, not a patch bump
      - dependency-name: "php"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Dashboards must share the OpenSearch cluster's major (opensearch-node1/2 in docker-compose.yml)
      - dependency-name: "opensearchproject/opensearch-dashboards"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    target-branch: "master"
    labels:
      - "security"
    cooldown:
      default-days: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Production runs MySQL 8.0, and 8.4 removed --default-authentication-plugin, which db and db-combatlog pass
      - dependency-name: "mysql"
        update-types: ["version-update:semver-minor"]

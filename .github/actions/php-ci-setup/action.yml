name: "PHP CI Setup"
description: "Common setup for Keystone.guru CI"

inputs:
  run-migrations:
    description: 'Whether to run database migrations and seeding'
    required: false
    default: 'true'

runs:
  using: "composite"
  steps:
    # Pinned commits for third-party toolchain repos built straight from git. Bump these
    # deliberately (not via unpinned HEAD) when an upstream fix/feature is needed - the pin is
    # baked into the cache keys below so a bump busts the cache correctly. php-lua has no tagged
    # releases; cli-weakauras-parser does (the pin below is refs/tags/v0.1.8) but tags are mutable
    # so the commit SHA is still pinned explicitly rather than the tag name.
    - name: Pin toolchain commit SHAs
      id: pins
      run: |
        echo "php-lua-sha=a76f01149e6132810fe6b3095f2b9bc597d34f9e" >> "$GITHUB_OUTPUT"
        echo "cli-weakauras-parser-sha=febb57faeaa805a79c9c2e0425c804e441a0e969" >> "$GITHUB_OUTPUT" # = v0.1.8
        echo "rust-toolchain=1.91.1" >> "$GITHUB_OUTPUT"
      shell: bash
    # No checkout here on purpose: a local composite action can only be resolved from an
    # already-checked-out workspace, so every caller has necessarily run actions/checkout before
    # reaching this point. A second checkout would wipe the workspace and refetch the whole repo -
    # ~889 MB across 46 branches and 448 tags, which is what made jobs stall for 10-15 minutes (#4135).

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, intl, pdo_mysql, bcmath, gd
        coverage: pcov

    # Ask composer for its real cache dir: on a fresh runner it is ~/.cache/composer/files, not
    # the legacy ~/.composer/cache/files, and caching the wrong path caches nothing.
    - name: Determine composer cache dir
      id: composer-cache
      run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Cache composer
      uses: actions/cache@v5
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: composer-

    - name: Install system clients (mysql + redis CLI)
      run: |
        # Drop the Microsoft apt repos preinstalled on the runner image (azure-cli, microsoft-prod);
        # nothing here installs from them, and their recurring CDN outages fail `apt-get update`
        # with "Clearsigned file isn't valid, got 'NOSPLIT'" (#3441).
        # The `|| true` matters: grep exits 1 when it matches nothing, which under `pipefail` would
        # fail the whole step the day the runner image stops shipping those repos.
        grep -lr "packages.microsoft.com" /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f || true

        # Point apt away from azure.archive.ubuntu.com: GitHub's regional Azure mirror stalls for
        # minutes at a time on hosted runners (#4135, actions/runner-images#7048), and
        # archive.ubuntu.com is what it eventually falls through to anyway.
        #
        # The runner image does NOT name the mirror in sources.list: ubuntu.sources uses
        # `mirror+file:/etc/apt/apt-mirrors.txt`, and that mirrorlist lists azure first. Dropping
        # the azure line there makes apt use the next entry (archive.ubuntu.com, which also carries
        # the -security pocket). The sed over sources.list / *.sources covers older or changed
        # runner images that spell the host out directly instead.
        #
        # The mirrorlist path is read back out of the `mirror+file:` URI rather than hardcoded, so a
        # renamed target doesn't silently turn this whole block into a no-op.
        MIRRORLIST="$(grep -rhoE 'mirror\+file:/[^[:space:]]+' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | head -n1 | cut -d: -f2-)" || true
        [ -n "$MIRRORLIST" ] || MIRRORLIST=/etc/apt/apt-mirrors.txt
        if [ -f "$MIRRORLIST" ] && grep -q 'azure\.archive\.ubuntu\.com' "$MIRRORLIST"; then
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' "$MIRRORLIST"
          # Never leave the mirrorlist empty - apt would then have no source at all.
          grep -qE '^[[:space:]]*https?://' "$MIRRORLIST" \
            || printf 'http://archive.ubuntu.com/ubuntu/\nhttp://security.ubuntu.com/ubuntu/\n' | sudo tee "$MIRRORLIST" >/dev/null
        fi
        sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
          /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true

        echo "==> effective apt mirrors ($MIRRORLIST):"
        cat "$MIRRORLIST" 2>/dev/null || echo "  (no mirrorlist)"

        # Capture the leftovers instead of branching on grep's exit status: GNU grep exits 2 when it
        # finds matches AND hits an unreadable path, so `grep ... && warn || ok` would print the
        # all-clear on any image missing one of these paths - the same false green that made the
        # first attempt at this fix look like it worked.
        AZURE_LEFT="$(grep -rl 'azure\.archive\.ubuntu\.com' /etc/apt/sources.list /etc/apt/sources.list.d/ "$MIRRORLIST" 2>/dev/null)" || true
        if [ -n "$AZURE_LEFT" ]; then
          echo "::warning::apt sources still point at azure.archive.ubuntu.com (#4135 rewrite missed a path): $(echo "$AZURE_LEFT" | tr '\n' ' ')"
        else
          echo "==> apt sources clean of azure mirror"
        fi

        # A drop-in rather than `-o` flags so `apt-get install` below - the download-heavy half -
        # gets the same retry/timeout behaviour as the update.
        printf 'Acquire::Retries "3";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' \
          | sudo tee /etc/apt/apt.conf.d/99-ci-retries >/dev/null

        sudo apt-get update
        sudo apt-get install -y default-mysql-client redis-tools lua5.3 liblua5.3-dev
      shell: bash

    # Cache the compiled lua.so / bit.so so we skip the ~30-40s phpize/configure/make on every run
    # (paid per shard once the test job is sharded). The pinned php-lua SHA is part of the key so
    # bumping it above busts the cache and triggers a rebuild.
    - name: Restore Lua extension build cache
      id: cache-lua-ext
      uses: actions/cache@v5
      with:
        path: ~/lua-ext-cache
        key: lua-ext-php8.4-${{ hashFiles('storage/lua/LuaBitOp-1.0.3.zip') }}-${{ steps.pins.outputs.php-lua-sha }}

    - name: Build PHP Lua extension
      run: |
        # Lua headers/libs are needed both to compile the extension and for the compiled .so to link
        # at runtime, so prepare them unconditionally (cheap).
        sudo ln -sfn /usr/include/lua5.3 /usr/include/lua
        sudo cp /usr/lib/*-linux-gnu/liblua5.3.a /usr/lib/liblua.a 2>/dev/null || true
        sudo cp /usr/lib/*-linux-gnu/liblua5.3.so.0.0.0 /usr/lib/liblua.so 2>/dev/null || true
        sudo ln -f /usr/include/lua5.3/lua.h /usr/include/lauxlib.h || true
        sudo ln -f /usr/include/lua5.3/lua.h /usr/include/lua.h || true
        sudo ln -f /usr/include/lua5.3/lua.h /usr/include/luaconf.h || true

        EXT_DIR="$(php -r 'echo ini_get("extension_dir");')"
        if [ -f ~/lua-ext-cache/lua.so ] && [ -f ~/lua-ext-cache/bit.so ]; then
          echo "==> Using cached Lua extension build"
          sudo cp ~/lua-ext-cache/lua.so "${EXT_DIR}/lua.so"
        else
          echo "==> Building Lua extension from source"
          git clone https://github.com/Wotuu/php-lua.git /tmp/php-lua
          cd /tmp/php-lua
          git checkout "${{ steps.pins.outputs.php-lua-sha }}"
          phpize
          ./configure
          make -j$(nproc)
          sudo make install
          unzip "${GITHUB_WORKSPACE}/storage/lua/LuaBitOp-1.0.3.zip" -d /tmp
          cd /tmp/LuaBitOp-1.0.3
          make -j$(nproc)
          mkdir -p ~/lua-ext-cache
          cp "${EXT_DIR}/lua.so" ~/lua-ext-cache/lua.so
          cp /tmp/LuaBitOp-1.0.3/bit.so ~/lua-ext-cache/bit.so
        fi

        echo "extension=lua.so" | sudo tee "$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')/99-lua.ini"
        php -m | grep -i lua
        sudo mkdir -p /usr/lib/lua/5.3/
        sudo cp ~/lua-ext-cache/bit.so /usr/lib/lua/5.3/
      shell: bash

    - name: Restore cli_weakauras_parser cache
      id: cache-cli-weakauras-parser
      uses: actions/cache@v5
      with:
        path: ~/.cargo/bin/cli_weakauras_parser
        key: cli-weakauras-parser-rust-${{ steps.pins.outputs.rust-toolchain }}-${{ steps.pins.outputs.cli-weakauras-parser-sha }}

    - name: Build cli_weakauras_parser
      if: steps.cache-cli-weakauras-parser.outputs.cache-hit != 'true'
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- --default-toolchain "${{ steps.pins.outputs.rust-toolchain }}" -y
        source "$HOME/.cargo/env"
        cargo install --git https://codeberg.org/Velithris/cli-weakauras-parser.git --rev "${{ steps.pins.outputs.cli-weakauras-parser-sha }}" --locked
      shell: bash

    - name: Install cli_weakauras_parser system-wide
      run: |
        sudo cp ~/.cargo/bin/cli_weakauras_parser /usr/bin/cli_weakauras_parser
        sudo chmod 0755 /usr/bin/cli_weakauras_parser
      shell: bash

    - name: Install PHP dependencies
      run: composer install --no-interaction --prefer-dist --optimize-autoloader
      shell: bash

    - name: Compute git version and save to file
      run: echo -n "$(git rev-parse HEAD)" >> version
      shell: bash

    - name: Prepare .env for CI
      run: |
        cp .env.ci.example .env || true
        php artisan key:generate --force -v
      shell: bash

    # Seeding the database costs ~84s and every caller of this action produces the exact same one, so
    # it is paid six times per PR by the php-tests shards alone, plus nightly by php-coverage and
    # twice per release by release-deploy (#4139). Cache a mysqldump of the seeded result instead:
    # on a hit the seed is skipped entirely and the dump is loaded, on a miss we seed exactly as
    # before and produce the dump for everyone else. A stale or absent cache therefore degrades to
    # the old behaviour rather than failing.
    #
    # There is deliberately NO `restore-keys` here (unlike the composer cache above): a prefix match
    # would silently hand a job a database seeded from *different* input files, which fails later,
    # elsewhere, and for a confusing reason. Exact key or miss.
    #
    # The key covers everything the seeders read from disk, enumerated from DatabaseSeeder::SEEDERS
    # rather than guessed - note that three of those inputs live outside database/seeders:
    #   - database/data/**    MDTAddonVersionSeeder, SpellDescriptionImportStateSeeder
    #   - lang/**             TranslationsSeeder globs lang_path() into the `translations` table
    #   - app/SeederHelpers/** the RelationParsers/RelationMappings that decide what the JSON becomes,
    #                          plus the LoadsSeasonData / LoadsMapIconTypeData traits
    # This file is hashed too: it holds the procedure (the migrate/seed commands, the mysqldump
    # flags), and a dump built by the old procedure must not keep being served after the procedure
    # changes.
    # Seeded output can still change through PHP that none of these paths cover (a model's boot
    # behaviour, say). Bump the `v1` epoch below by hand when that happens - over-invalidating costs
    # one seed, under-invalidating costs a confusing red build.
    #
    # The ISO week stamp caps how long one dump can be served. Eviction alone would not: GitHub's
    # 7-day rule counts from last *access*, and this key is read six times per PR plus nightly, so a
    # dump for an unchanged set of inputs would otherwise be reused indefinitely.
    # Nothing seeded is known to depend on when the seed ran - seeded timestamps come from committed
    # JSON via TimestampAttributeParser, and MappingVersionSeeder's Carbon::now() branch is dead
    # behind its `MappingVersion::count() !== 0` guard once DungeonDataSeeder has run - so this is
    # insurance against a future time-dependent seeder rather than a fix for a known one. It costs
    # one re-seed a week, absorbed by ci-db-warm on the next push to master.
    - name: Stamp the ISO week for the database cache key
      id: db-cache-week
      if: ${{ inputs.run-migrations == 'true' }}
      run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Restore seeded database dump
      id: cache-db
      if: ${{ inputs.run-migrations == 'true' }}
      uses: actions/cache/restore@v5
      with:
        path: ~/ci-db-dump
        key: ci-db-v1-${{ steps.db-cache-week.outputs.week }}-${{ hashFiles('database/migrations/**', 'database/migrations_combatlog/**', 'database/schema/**', 'database/seeders/**', 'database/data/**', 'lang/**', 'app/SeederHelpers/**', '.env.ci.example', 'docker-compose.ci.yml', '.github/actions/php-ci-setup/action.yml') }}

    - name: Migrate & seed
      if: ${{ inputs.run-migrations == 'true' && steps.cache-db.outputs.cache-hit != 'true' }}
      run: |
        php artisan migrate --database=migrate --force
        php artisan migrate --database=combatlog --path=database/migrations_combatlog --force
        php artisan db:seed --database=migrate --force -v

        # Dump from *inside* the container, not with the runner's client: `default-mysql-client`
        # installed above resolves to the MariaDB client on Ubuntu, which skews against a MySQL
        # 8.0.42 server. This is the same reason sh/worktree.sh:load_schema_dump() pipes through
        # `docker exec` instead of using the app image's client. Print the version so which client
        # actually ran is on record in the log.
        mkdir -p ~/ci-db-dump
        # --routines --events are not needed today (neither schema defines any, and triggers are
        # dumped by default) but are cheap insurance: the cached dump outlives the run that made it,
        # so a routine added later must not go silently missing on every cache hit.
        docker compose -f docker-compose.ci.yml exec -T db mysqldump --version
        docker compose -f docker-compose.ci.yml exec -T db \
          mysqldump --no-tablespaces --single-transaction --routines --events -uroot -proot \
          'keystone.guru.dev' > ~/ci-db-dump/main.sql
        docker compose -f docker-compose.ci.yml exec -T db-combatlog \
          mysqldump --no-tablespaces --single-transaction --routines --events -uroot -proot \
          'keystone.guru.combatlog' > ~/ci-db-dump/combatlog.sql
        ls -la ~/ci-db-dump
      shell: bash

    # TEMPORARY (#4139) - evidence for the PR that a restored dump is byte-for-byte the database that
    # was seeded, not merely a plausible one. Restores each freshly written dump into a scratch schema
    # on the same server and compares per-table COUNT(*) and CHECKSUM TABLE against the source schema.
    # It deliberately compares a seed run against ITS OWN dump: comparing a fresh seed against an
    # older dump would differ purely through created_at/now()-derived columns. Removed before this MR
    # is handed off.
    - name: TEMP - verify dump/restore equivalence
      if: ${{ inputs.run-migrations == 'true' && steps.cache-db.outputs.cache-hit != 'true' }}
      run: |
        SCRATCH=ksg_dumpcheck

        # CHECKSUM TABLE reports its Table column as `schema.table`, and no table name here contains a
        # dot - so keeping the trailing segment is what makes two schemas' output comparable.
        report_sql() {
          cat <<SQL
        SET SESSION group_concat_max_len = 1048576;
        SET @cs := (SELECT GROUP_CONCAT(CONCAT('\`', table_schema, '\`.\`', table_name, '\`'))
                    FROM information_schema.tables
                    WHERE table_schema = '$1' AND table_type = 'BASE TABLE');
        SET @cn := (SELECT GROUP_CONCAT(CONCAT('SELECT ''', table_name, ''' AS t, COUNT(*) AS c FROM \`',
                                               table_schema, '\`.\`', table_name, '\`') SEPARATOR ' UNION ALL ')
                    FROM information_schema.tables
                    WHERE table_schema = '$1' AND table_type = 'BASE TABLE');
        SET @cs := CONCAT('CHECKSUM TABLE ', @cs);
        PREPARE s FROM @cs; EXECUTE s; DEALLOCATE PREPARE s;
        PREPARE s FROM @cn; EXECUTE s; DEALLOCATE PREPARE s;
        SQL
        }

        compare() {
          local service="$1" source_schema="$2" dump="$3"
          local dbc=(docker compose -f docker-compose.ci.yml exec -T "$service" mysql -uroot -proot -N -B)

          "${dbc[@]}" -e "DROP DATABASE IF EXISTS \`${SCRATCH}\`; CREATE DATABASE \`${SCRATCH}\`;"
          "${dbc[@]}" "${SCRATCH}" < "$dump"

          local seeded="$RUNNER_TEMP/seeded.$service" restored="$RUNNER_TEMP/restored.$service"
          "${dbc[@]}" -e "$(report_sql "$source_schema")" \
            | awk -F'\t' '{ n = split($1, a, "."); print a[n] "\t" $2 }' | sort > "$seeded"
          "${dbc[@]}" -e "$(report_sql "$SCRATCH")" \
            | awk -F'\t' '{ n = split($1, a, "."); print a[n] "\t" $2 }' | sort > "$restored"

          # Without this, a report that failed to produce any rows at all compares equal to another
          # empty report and the whole check passes vacuously.
          if [ ! -s "$seeded" ]; then
            echo "::error::${source_schema}: produced an empty checksum report"
            exit 1
          fi

          # The checksum/count report only covers BASE TABLEs, so it is blind to views, routines and
          # events going missing. Diffing the two schemas' structure covers that, and needs the
          # AUTO_INCREMENT= counters stripped: a restored table can legitimately land on a different
          # next-id when the source had a gap at the top. Content is the checksums' job, not this.
          local schema_a="$RUNNER_TEMP/schema-seeded.$service" schema_b="$RUNNER_TEMP/schema-restored.$service"
          # --skip-comments drops the header, which would otherwise differ on its `Database:` line.
          # The second sed normalises a rendering-only difference: mysqldump writes a column-level
          # `COLLATE` without a `CHARACTER SET`, and MySQL treats parsing that as the charset having
          # been explicitly specified, so the restored table's SHOW CREATE TABLE gains a
          # `CHARACTER SET utf8mb4` the seeded one does not have. information_schema.columns reports
          # utf8mb4/utf8mb4_unicode_ci for both either way, and a collation name pins its charset, so
          # dropping the redundant CHARACTER SET in front of a COLLATE hides nothing real.
          structure_of() {
            docker compose -f docker-compose.ci.yml exec -T "$service" \
              mysqldump --no-data --no-tablespaces --routines --events --skip-comments -uroot -proot "$1" \
              | sed -E 's/ AUTO_INCREMENT=[0-9]+//' \
              | sed -E 's/ CHARACTER SET [A-Za-z0-9_]+ COLLATE / COLLATE /g'
          }
          structure_of "$source_schema" > "$schema_a"
          structure_of "$SCRATCH" > "$schema_b"

          # AUTO_INCREMENT is stripped from the structure diff above (a restored table can land on a
          # different next-id when the source has a gap at the top, which is not a defect), but
          # whether id sequences survive is exactly what #4139 asked to verify - so report it here
          # instead of silently erasing the evidence. Non-fatal by design.
          echo "==> ${source_schema}: seeded vs restored"

          local ai_a="$RUNNER_TEMP/autoinc-seeded.$service" ai_b="$RUNNER_TEMP/autoinc-restored.$service"
          auto_increments() {
            "${dbc[@]}" -e "SELECT table_name, IFNULL(auto_increment, 'none') FROM information_schema.tables
                            WHERE table_schema = '$1' AND table_type = 'BASE TABLE' ORDER BY table_name"
          }
          auto_increments "$source_schema" > "$ai_a"
          auto_increments "$SCRATCH" > "$ai_b"
          if diff "$ai_a" "$ai_b" > "$RUNNER_TEMP/autoinc.diff"; then
            echo "    AUTO_INCREMENT counters identical across all tables"
          else
            echo "::warning::${source_schema}: AUTO_INCREMENT counters differ after restore"
            cat "$RUNNER_TEMP/autoinc.diff"
          fi

          if diff "$seeded" "$restored" && diff "$schema_a" "$schema_b"; then
            echo "    identical - $(( $(wc -l < "$seeded") / 2 )) tables, checksums, row counts and structure all match"
          else
            echo "::error::${source_schema}: restored dump differs from the seeded database"
            exit 1
          fi

          "${dbc[@]}" -e "DROP DATABASE \`${SCRATCH}\`;"
        }

        compare db 'keystone.guru.dev' ~/ci-db-dump/main.sql
        compare db-combatlog 'keystone.guru.combatlog' ~/ci-db-dump/combatlog.sql
      shell: bash

    # Saved here rather than by the combined actions/cache, whose post-job save does not run when the
    # job fails - seeding happens in setup and PHPUnit runs after it, so a single failing test would
    # otherwise throw the dump away and make the next run seed again.
    # On a cold cache all six php-tests shards seed in parallel and race to write this one key. No
    # continue-on-error is needed for that: actions/cache/save logs "Failed to save: Unable to
    # reserve cache with key ..., another job may be creating this cache" and still succeeds
    # (observed on this PR's first cold run, where five shards lost the race and none failed). Left
    # off deliberately, so a save that fails for a real reason is still visible.
    - name: Save seeded database dump
      if: ${{ inputs.run-migrations == 'true' && steps.cache-db.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ~/ci-db-dump
        key: ${{ steps.cache-db.outputs.cache-primary-key }}

    # The dumps carry the `migrations` table, so Laravel sees a fully migrated schema, and mysqldump
    # emits AUTO_INCREMENT= on every CREATE TABLE, so id sequences survive the round trip. The
    # per-job `Seed users` step (LaratrustSeeder) still runs after this action in the workflows, on
    # both paths, exactly as before.
    - name: Load seeded database dump
      if: ${{ inputs.run-migrations == 'true' && steps.cache-db.outputs.cache-hit == 'true' }}
      run: |
        docker compose -f docker-compose.ci.yml exec -T db \
          mysql -uroot -proot 'keystone.guru.dev' < ~/ci-db-dump/main.sql
        docker compose -f docker-compose.ci.yml exec -T db-combatlog \
          mysql -uroot -proot 'keystone.guru.combatlog' < ~/ci-db-dump/combatlog.sql
      shell: bash

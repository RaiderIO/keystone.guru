name: PHP Tests

# No base-branch filter: stacked PRs (one PR targeting another open PR's branch) must run the
# same tests as PRs against master (#4074).
# Draft PRs skip this suite (#4343) and get the single-runner php-tests (affected) job below
# instead (#4574); the full matrix runs on ready_for_review, on pushes to non-draft PRs,
# and on pushes to a draft carrying the `run full ci` label (add the label, then push to trigger
# a run — #4473: a `labeled` trigger produces a run for every label, and a run whose job is
# skipped by `if:` leaves the required php-tests (...) checks permanently unreported for that
# commit, blocking merge even though an earlier run on the same commit already passed them).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# Cancel superseded runs (#4343).
concurrency:
  group: php-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # A draft push runs only the PHPUnit groups that can observe the changed files, on one runner
  # (#4574). `php artisan test:affected-groups` (App\Logic\Testing\AffectedTestGroupsResolver holds
  # the path-to-group table) decides: "groups --group=A --group=B" runs those groups, "full" runs the
  # whole suite (a shared or unmapped path changed - the paths are named in the log), "none" runs
  # nothing. The full matrix at ready_for_review is the safety net for a mapping that is too narrow.
  # The changed files come from the pull request API: the checkout below is shallow (#4135), so
  # there is no local history to diff against.
  php-tests-affected:
    runs-on: ubuntu-latest

    if: >-
      contains(fromJSON('["opened", "reopened", "synchronize"]'), github.event.action) &&
      github.event.pull_request.draft == true &&
      !contains(github.event.pull_request.labels.*.name, 'run full ci')

    permissions:
      contents: read
      pull-requests: read

    name: php-tests (affected)

    steps:
      - name: Checkout for local actions
        uses: actions/checkout@v7

      - name: Start services
        run: docker compose -f docker-compose.ci.yml up -d --wait

      - name: Common PHP/Laravel setup
        uses: ./.github/actions/php-ci-setup

      - name: Switch APP_ENV to testing
        run: echo "APP_ENV=testing" >> .env

      - name: Seed users
        run: php artisan db:seed --class=LaratrustSeeder --database=migrate

      - name: Resolve the affected test groups
        id: affected
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename' > changed-files.txt
          echo "Changed files:"
          cat changed-files.txt
          read -r VERDICT PHPUNIT_ARGS <<< "$(php artisan test:affected-groups --stdin < changed-files.txt)"
          echo "Verdict: ${VERDICT} ${PHPUNIT_ARGS}"
          echo "verdict=${VERDICT}" >> "$GITHUB_OUTPUT"
          echo "phpunit-args=${PHPUNIT_ARGS}" >> "$GITHUB_OUTPUT"

      - name: Run PHPUnit (affected groups)
        if: steps.affected.outputs.verdict != 'none'
        run: |
          set -o pipefail
          ./vendor/bin/phpunit ${{ steps.affected.outputs.phpunit-args }} --exclude-group=Nightly 2>&1 | tee phpunit-output.log

      - name: Assert no log lines leaked into the test output
        if: steps.affected.outputs.verdict != 'none'
        run: |
          if grep -nE '\] [A-Za-z0-9_-]+\.(DEBUG|INFO|NOTICE|WARNING|ERROR|CRITICAL|ALERT|EMERGENCY): ' phpunit-output.log; then
            echo "::error::Log lines leaked into PHPUnit's own output - see #3782"
            exit 1
          fi

  php-tests:
    runs-on: ubuntu-latest

    if: >-
      github.event.action == 'ready_for_review' ||
      (contains(fromJSON('["opened", "reopened", "synchronize"]'), github.event.action) &&
        (github.event.pull_request.draft == false ||
         contains(github.event.pull_request.labels.*.name, 'run full ci')))

    # The suite is split into shards that run concurrently on separate runners, each with its own
    # MySQL, so wall-clock time is the slowest shard instead of the sum:
    #   - combatlog-route / correct-events : the two subgroups of the heavy APICombatLog suite
    #     (together they equal the whole APICombatLog group).
    #   - feature-controller / feature-other : the Feature suite, split by the Controller group.
    #     Since a shard's "--group=X" is always paired with "--exclude-group=X" on the catch-all
    #     feature-other shard, the two are exact complements: guaranteed to cover the whole Feature
    #     suite with no overlap and no dropped tests.
    #   - unit : the Unit suite.
    # Every shard excludes the Nightly group (DungeonDataSeederTest, MapTilesExistenceTest): those
    # classes cost far more than the rest of the suite and run only in php-coverage.yml, the nightly
    # workflow. The five shards are disjoint and together equal the full run minus Nightly. Using
    # --testsuite (not a positional path) keeps the Unit suite's phpunit.xml <exclude> entries
    # honoured and auto-covers newly added test files. Coverage is NOT computed here (it is
    # instrumentation overhead) — see php-coverage.yml for the coverage run.
    #
    # Balance is measured, not guessed - the phpunit-junit-<shard> artifacts each job uploads below hold
    # the per-test times, so the next rebalance starts from data rather than from a fresh measurement
    # run. Local timings are NOT a usable substitute: a development test database carries orders of
    # magnitude more rows than CI's freshly-seeded one, which makes DB-heavy tests wildly slower there.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: combatlog-route
            phpunit-args: "--group=CombatLogRoute --exclude-group=Nightly"
          - shard: correct-events
            phpunit-args: "--group=CorrectEvents --exclude-group=Nightly"
          - shard: feature-controller
            phpunit-args: "--testsuite \"Feature Tests\" --group=Controller --exclude-group=APICombatLog --exclude-group=Nightly"
          - shard: feature-other
            phpunit-args: "--testsuite \"Feature Tests\" --exclude-group=Controller --exclude-group=APICombatLog --exclude-group=Nightly"
          - shard: unit
            phpunit-args: "--testsuite \"Unit Tests\" --exclude-group=Nightly"

    name: php-tests (${{ matrix.shard }})

    steps:
      - name: Checkout for local actions
        # Shallow on purpose: nothing in CI reads git history (the only git command is
        # `git rev-parse HEAD` for the version file), and a full fetch of 46 branches + 448 tags
        # cost 10-15 minutes per job (#4135).
        uses: actions/checkout@v7

      - name: Start services
        run: docker compose -f docker-compose.ci.yml up -d --wait

      - name: Common PHP/Laravel setup
        uses: ./.github/actions/php-ci-setup

      - name: Switch APP_ENV to testing
        run: echo "APP_ENV=testing" >> .env

      - name: Seed users
        run: php artisan db:seed --class=LaratrustSeeder --database=migrate

      - name: Run PHPUnit (${{ matrix.shard }})
        run: |
          set -o pipefail
          ./vendor/bin/phpunit ${{ matrix.phpunit-args }} --log-junit phpunit-junit.xml 2>&1 | tee phpunit-output.log

      # Per-test wall-clock times, the input for rebalancing the shards above. Local timings are not a usable
      # proxy - a development test database carries orders of magnitude more rows than CI's freshly-seeded one,
      # so DB-heavy tests are wildly slower locally - which makes the CI run itself the only honest measurement.
      - name: Upload per-test timings (${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phpunit-junit-${{ matrix.shard }}
          path: phpunit-junit.xml
          if-no-files-found: warn

      # Structured logging reaching the console during a test run interleaves ANSI-coloured log lines with the
      # progress output, and has now regressed twice (#3722, #3782) because every guard against it lived in
      # application state that a test is free to change. Assert on the PHPUnit step's own output only: the setup
      # steps above run real artisan commands, which log to stderr legitimately. The pattern is verified against
      # the log of the run that prompted #3782 - it matches all 965 of its leaked lines.
      #
      # Skipped when PHPUnit itself fails (the default success() condition), deliberately: a red shard has a real
      # failure to fix first, and a failure diff is exactly the kind of output that could match by accident.
      - name: Assert no log lines leaked into the test output
        run: |
          if grep -nE '\] [A-Za-z0-9_-]+\.(DEBUG|INFO|NOTICE|WARNING|ERROR|CRITICAL|ALERT|EMERGENCY): ' phpunit-output.log; then
            echo "::error::Log lines leaked into PHPUnit's own output - see #3782"
            exit 1
          fi

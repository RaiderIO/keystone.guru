name: PHP Tests

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  php-tests:
    runs-on: ubuntu-latest

    # The suite is split into shards that run concurrently on separate runners, each with its own
    # MySQL, so wall-clock time is the slowest shard instead of the sum:
    #   - combatlog-route / correct-events : the two subgroups of the heavy APICombatLog suite
    #     (together they equal the whole APICombatLog group).
    #   - feature-controller / feature-seeder / feature-other : the Feature suite, split by the
    #     Controller and DungeonDataSeeder groups. Since a shard's "--group=X" is always paired with
    #     "--exclude-group=X" on the catch-all feature-other shard, the three are exact complements:
    #     guaranteed to cover the whole Feature suite with no overlap and no dropped tests.
    #   - unit : the Unit suite.
    # The six shards are disjoint and together equal the full run minus MapTiles
    # (429 + 3 + 1103 + 46 + 32 + 752 = 2365, verified with --list-tests). Using --testsuite (not a positional path) keeps the Unit
    # suite's phpunit.xml <exclude> entries honoured and auto-covers newly added test files. Coverage
    # is NOT computed here (it is instrumentation overhead) — see php-coverage.yml for the coverage run.
    #
    # Balance is measured, not guessed - the phpunit-junit-<shard> artifacts each job uploads below hold
    # the per-test times, so the next rebalance starts from data rather than from a fresh measurement
    # run. Local timings are NOT a usable substitute: a development test database carries orders of
    # magnitude more rows than CI's freshly-seeded one, which makes DB-heavy tests wildly slower there.
    #
    # feature-seeder exists because DungeonDataSeederTest's three tests each run a full DungeonDataSeeder
    # (~76s apiece on CI), so that one class was 229s of feature-other's 433s - over half the shard, and
    # single-handedly the critical path of the whole workflow. It is its own shard rather than being
    # spread out because #[Group] is applied at the class level in this project, so the class is
    # indivisible for sharding purposes; 229s is therefore the floor for the slowest shard here. Driving
    # it lower needs the test itself to change (one seeder run shared across the three assertions, or the
    # class split into three) - deliberately out of scope for a CI-only change.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: combatlog-route
            phpunit-args: "--group=CombatLogRoute"
          - shard: correct-events
            phpunit-args: "--group=CorrectEvents"
          - shard: feature-controller
            phpunit-args: "--testsuite \"Feature Tests\" --group=Controller --exclude-group=APICombatLog --exclude-group=MapTiles"
          - shard: feature-seeder
            phpunit-args: "--testsuite \"Feature Tests\" --group=DungeonDataSeeder --exclude-group=MapTiles"
          - shard: feature-other
            phpunit-args: "--testsuite \"Feature Tests\" --exclude-group=Controller --exclude-group=DungeonDataSeeder --exclude-group=APICombatLog --exclude-group=MapTiles"
          - shard: unit
            phpunit-args: "--testsuite \"Unit Tests\" --exclude-group=MapTiles"

    name: php-tests (${{ matrix.shard }})

    steps:
      - name: Checkout for local actions
        # Shallow on purpose: nothing in CI reads git history (the only git command is
        # `git rev-parse HEAD` for the version file), and a full fetch of 46 branches + 448 tags
        # cost 10-15 minutes per job (#4135).
        uses: actions/checkout@v7

      - name: Start services
        run: docker compose -f docker-compose.ci.yml up -d --wait

      - name: Common PHP/Laravel setup
        uses: ./.github/actions/php-ci-setup

      - name: Switch APP_ENV to testing
        run: echo "APP_ENV=testing" >> .env

      - name: Seed users
        run: php artisan db:seed --class=LaratrustSeeder --database=migrate

      - name: Run PHPUnit (${{ matrix.shard }})
        run: |
          set -o pipefail
          ./vendor/bin/phpunit ${{ matrix.phpunit-args }} --log-junit phpunit-junit.xml 2>&1 | tee phpunit-output.log

      # Per-test wall-clock times, the input for rebalancing the shards above. Local timings are not a usable
      # proxy - a development test database carries orders of magnitude more rows than CI's freshly-seeded one,
      # so DB-heavy tests are wildly slower locally - which makes the CI run itself the only honest measurement.
      - name: Upload per-test timings (${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phpunit-junit-${{ matrix.shard }}
          path: phpunit-junit.xml
          if-no-files-found: warn

      # Structured logging reaching the console during a test run interleaves ANSI-coloured log lines with the
      # progress output, and has now regressed twice (#3722, #3782) because every guard against it lived in
      # application state that a test is free to change. Assert on the PHPUnit step's own output only: the setup
      # steps above run real artisan commands, which log to stderr legitimately. The pattern is verified against
      # the log of the run that prompted #3782 - it matches all 965 of its leaked lines.
      #
      # Skipped when PHPUnit itself fails (the default success() condition), deliberately: a red shard has a real
      # failure to fix first, and a failure diff is exactly the kind of output that could match by accident.
      - name: Assert no log lines leaked into the test output
        run: |
          if grep -nE '\] [A-Za-z0-9_-]+\.(DEBUG|INFO|NOTICE|WARNING|ERROR|CRITICAL|ALERT|EMERGENCY): ' phpunit-output.log; then
            echo "::error::Log lines leaked into PHPUnit's own output - see #3782"
            exit 1
          fi

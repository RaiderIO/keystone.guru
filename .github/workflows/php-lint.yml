name: PHP Lint

# PHPStan + php-cs-fixer in one job (#4343). Renamed from `phpstan` — the required status
# context in branch protection must follow the rename.
#
# No base-branch filter on pull_request: stacked PRs (one PR targeting another open PR's branch)
# must run the same analysis as PRs against master (#4074).
# The push trigger seeds branch-scoped caches from master (composer + Lua ext + cargo via
# php-ci-setup — the same keys php-tests restores — plus the PHP CS Fixer and PHPStan
# result caches below); without it every new PR's first run is fully cold.
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

# Cancel superseded PR runs (#4343); master cache-seed runs are never cancelled, only serialised.
concurrency:
  group: php-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  php-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout for local actions
        # Shallow on purpose: nothing in CI reads git history (the only git command is
        # `git rev-parse HEAD` for the version file), and a full fetch of 46 branches + 448 tags
        # cost 10-15 minutes per job (#4135).
        uses: actions/checkout@v7

      - name: Common PHP/Laravel setup
        uses: ./.github/actions/php-ci-setup
        with:
          run-migrations: 'false'

      # Both tools keep a per-file result cache and invalidate stale entries themselves (the
      # cs-fixer one on a rules/version/PHP change as well). Only the master push saves them: a PR
      # restores its own branch's caches before master's, so caches saved by PR runs would hand a
      # PR's later push the state of its previous one instead of current master's.
      - name: Restore the PHP CS Fixer and PHPStan result caches
        uses: actions/cache/restore@v6
        with:
          path: |
            .php-cs-fixer.cache
            tmp/phpstan
          key: php-lint-results-${{ github.run_id }}
          restore-keys: php-lint-results-

      - name: Run PHP CS Fixer (dry run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse -c phpstan.neon --memory-limit=1G

      - name: Save the PHP CS Fixer and PHPStan result caches
        if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: |
            .php-cs-fixer.cache
            tmp/phpstan
          key: php-lint-results-${{ github.run_id }}

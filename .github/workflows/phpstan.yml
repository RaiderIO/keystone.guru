name: PHPStan

# No base-branch filter on pull_request: stacked PRs (one PR targeting another open PR's branch)
# must run the same analysis as PRs against master (#4074).
# The push trigger seeds branch-scoped caches from master (composer + Lua ext + cargo via
# php-ci-setup — the same keys the php-tests shards restore); without it every new PR's first
# run is fully cold (#3612).
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  phpstan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout for local actions
        # Shallow on purpose: nothing in CI reads git history (the only git command is
        # `git rev-parse HEAD` for the version file), and a full fetch of 46 branches + 448 tags
        # cost 10-15 minutes per job (#4135).
        uses: actions/checkout@v7

      - name: Common PHP/Laravel setup
        uses: ./.github/actions/php-ci-setup
        with:
          run-migrations: 'false'

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse -c phpstan.neon --memory-limit=1G

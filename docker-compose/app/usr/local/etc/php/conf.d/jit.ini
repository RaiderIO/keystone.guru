; Applies wherever OPcache is enabled, which is php-fpm by default. CLI OPcache stays off here: a
; short-lived artisan call would pay ~200-400 ms to compile the framework into a throwaway
; per-process cache. Images that run long-lived CLI processes enable opcache.enable_cli themselves.
opcache.jit=tracing
opcache.jit_buffer_size=128M

# Both MySQL servers are throwaway: no volumes, destroyed along with the runner. The `command`
# overrides therefore trade durability we can never need for speed on the two things CI actually
# does with them - seeding the database, and restoring the cached dump of it (#4139). MySQL 8
# enables the binary log by default, which on its own roughly halves write throughput.
services:
  db:
    image: mysql:8.0.42
    command: --skip-log-bin --innodb-flush-log-at-trx-commit=0 --innodb-doublewrite=OFF
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: keystone.guru.dev
      MYSQL_USER: homestead
      MYSQL_PASSWORD: secret
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-combatlog:
    image: mysql:8.0.42
    command: --skip-log-bin --innodb-flush-log-at-trx-commit=0 --innodb-doublewrite=OFF
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: keystone.guru.combatlog
      MYSQL_USER: homestead
      MYSQL_PASSWORD: secret
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
